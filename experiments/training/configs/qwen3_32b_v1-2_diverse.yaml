model:
  name:         "Qwen/Qwen3-32B"
  lora_r:       16        # Stage1 unused; Stage2 LoRA rank
  lora_alpha:   32
  lora_dropout: 0.1


# ══════════════════════════════════════════════════════════════════════════
# decoder-scaling experiment — Qwen3-32B decoder, v1-2 architecture.
#   Donor : Llama-3.1-8B-Instruct @ layer 27 (existing cache: finetune_diversified/)
#   Decoder: Qwen3-32B (post-trained / instruction-following)
#   Adapter: cross-attn Q-Former (2 stacked CrossAttn+FFN blocks)
#   Data  : finetune_diversified (21 sources Stage1 / 17 QA Stage2)
#
# Parallel to qwen3_{0_6,4,8}b_v1-2_diverse.yaml.
# Frozen LM in bf16 (~64 GB) + gradient checkpointing → fits 1× A100 80 G
# with conservative batch size; only the cross-attn adapter trains, so no
# optimizer state for the LM.
# ══════════════════════════════════════════════════════════════════════════

training:
  lm_lr:                5.0e-5
  adapter_lr:           1.0e-3
  weight_decay:         0.01
  warmup_ratio:         0.05
  grad_clip:            1.0
  n_epochs:             4
  eval_steps:           200
  early_stop_patience:  3
  early_stop_min_delta: 1.0e-4

tasks:
  activation:
    task_training:
      batch_size:       16
      grad_accum_steps: 24       # eff global: 16 × 4 ranks × 24 = 1536  (match 4B/8B v1-2)
    adapter:
      type:       "cross_attn"
      n_tokens:   64
      dropout:    0.1
      n_contexts: 8
      n_heads:    8
      n_layers:   2
      ffn_mult:   4
    dataset:
      source:        null        # auto-discover 21 sources under finetune_diversified
      n_samples:     null
      seed:          42
      test_ratio:    0.05
      recon_ratio:   1.0
      max_label_len: 128
    io:
      output_dir: "checkpoints/oracle_act_qwen3_32b_v1-2_diverse"
      resume:     true

    finetune:
      output_dir:          "checkpoints/oracle_ft_qwen3_32b_v1-2_diverse"
      lm_lr:               1.0e-4
      adapter_lr:          3.0e-4
      weight_decay:        0.01
      warmup_ratio:        0.1
      grad_clip:           1.0
      n_epochs:            4
      eval_steps:          200
      batch_size:          4
      grad_accum_steps:    16
      lora_target_modules: ["q_proj", "v_proj"]

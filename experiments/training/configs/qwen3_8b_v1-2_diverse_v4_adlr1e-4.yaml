model:
  name:         "Qwen/Qwen3-8B"
  lora_r:       64
  lora_alpha:   128
  lora_dropout: 0.1


# ══════════════════════════════════════════════════════════════════════════
# v4 — Setting C：stage-1 adapter_lr 3e-4 → 1e-4（hp 不稳定假设的探针）。
#
# 背景（7/10 排查，详见 rebuttal/exp_rebuttal.md R5）：
#   8B 是 decoder-scaling 组里唯一 stage-1 eval 剧烈震荡的 decoder——
#   v2 (1035510) 和 v3 (1042684) 两次独立 run 都在早期 ±0.13 来回弹
#   （v3: 2.86→2.72→2.85），4B/14B 同 hp 同数据完全平滑。v3 收敛后
#   act=2.6493，但相对 4B(2.6929) 只赚 0.04（14B 赚 0.24），下游
#   gen-eval 0.264 仍低于 4B 0.284 —— 怀疑震荡把 adapter 甩进次优 basin。
#   排除项：数据（全组同一份）、adapter 规模（14B 797M > 8B 537M 却稳）、
#   in_dim==lm_dim 巧合（adapter.py 无特殊分支）、ft 训练量（4B best 也在 ~ep6）。
#
# v4 唯一改动：training.adapter_lr 3e-4 → 1e-4。
#   曲线平稳 + act ≤2.60 + gen 落回 4B–14B 之间 → 坐实纯 hp 问题，v4 换掉表里 8B 点。
#   还震荡/没改善 → Qwen3-8B decoder 架构层面问题，8B 点 footnote 或删。
# ══════════════════════════════════════════════════════════════════════════

training:
  lm_lr:                5.0e-5
  adapter_lr:           1.0e-4          # v3: 3.0e-4 —— 本实验唯一变量
  weight_decay:         0.01
  warmup_ratio:         0.05
  grad_clip:            1.0
  n_epochs:             16
  eval_steps:           200
  early_stop_patience:  10
  early_stop_min_delta: 0.0

tasks:
  activation:
    task_training:
      batch_size:       128
      grad_accum_steps: 3
    adapter:
      type:       "cross_attn"
      n_tokens:   64
      dropout:    0.1
      n_contexts: 8
      n_heads:    8
      n_layers:   2
      ffn_mult:   4
    dataset:
      source: ["ag_news", "ag_news_extra",
               "dair_emotion", "dair_emotion_extra",
               "latentqa_control",
               "lmsys_user", "lmsys_user_extra",
               "md_gender",
               "ner",
               "scientific",
               "sst2",
               "tweeteval_emotion",
               "tweeteval_sentiment", "tweeteval_sentiment_extra",
               "wikipedia_concept", "wikipedia_event", "wikipedia_generic",
               "wikipedia_organization", "wikipedia_person",
               "wikipedia_place", "wikipedia_work"]
      n_samples:     null
      seed:          42
      test_ratio:    0.05
      recon_ratio:   0.8
      max_label_len: 128
      subdir:        "finetune_diversified"
      reps_subdir:   "finetune_diversified"
    io:
      output_dir: "checkpoints/oracle_act_qwen3_8b_v1-2_diverse_v4_adlr1e-4"
      resume:     true

    finetune:
      output_dir:           "checkpoints/oracle_ft_qwen3_8b_v1-2_diverse_v4_adlr1e-4"
      lm_lr:                1.0e-4
      adapter_lr:           5.0e-5
      weight_decay:         0.01
      warmup_ratio:         0.1
      grad_clip:            1.0
      n_epochs:             10
      eval_steps:           200
      early_stop_patience:  5
      early_stop_min_delta: 0.0
      batch_size:           128
      grad_accum_steps:     3
      lora_target_modules:  "all-linear"
      raw_subdir:           "finetune_diversified"
      qa_subdir:            "finetune_qa_diversified"
      reps_subdir:          "finetune_diversified"
      train_subsample_ratio: null

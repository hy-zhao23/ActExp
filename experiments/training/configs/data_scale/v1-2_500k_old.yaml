model:
  name:         "Qwen/Qwen3-4B"
  lora_r:       64                    # stage-2 LoRA (stage-1 不用 LoRA, 此值被忽略)
  lora_alpha:   128
  lora_dropout: 0.1


# ══════════════════════════════════════════════════════════════════════════
# data-scale ablation 1/4: v1-2 setting on 500k OLD wiki+sci mix
#
# Purpose
# -------
# 4 个对比实验的第一个 (control). 后面三个换成 diverse 数据.
#   1. [此 config]  500k OLD recon  +  500k OLD QA  ← 当前
#   2.              500k diverse recon + 500k diverse QA   (待新数据集)
#   3.              1M   diverse recon + 1M   diverse QA   (待新数据集)
#   4.              2M   diverse recon + 2M   diverse QA   (待新数据集)
#
# Hyperparameter inheritance
# --------------------------
# Stage-1 完全继承 v1-2_ep16 (cross-attn SOTA, eval 1.3774):
#   adapter_lr=3e-4, lm_lr=5e-5, eff_batch=1536, n_epochs=16,
#   adapter=cross_attn 2L+FFN×4, n_tokens=64.
#
# Stage-2 继承 v1-2_2M_lr1e-4 (q-former stage-2 SOTA, eval 1.6406):
#   lm_lr=1e-4, adapter_lr=5e-5, lora_r=64/α=128 all-linear,
#   eff_batch=1536, n_epochs=10.
#
# 数据子采样
# ----------
# Stage-1: dataset.n_samples = 312500 → wiki/sci 各采 312500
#          → test_ratio=0.2 切分得 250k train + 62.5k test 每 source
#          → ConcatDataset 合计 500k train + 125k test (1:1 mix, 不是 60:40)
#
# Stage-2: train_subsample_ratio = 0.154 (≈ 500000 / 3240915)
#          per-source stratified, seed=42 → 约 500k QA samples
#          (eval split 不动: 仍是 ~15.7k QA)
#
# Step budget (eff batch = 128 × 4 ranks × 3 grad_accum = 1536)
# ------------------------------------------------------------
#   Stage 1: 500k / 1536 ≈ 326 steps/epoch × 16 ep ≈ 5,200 optimizer steps
#   Stage 2: 500k / 1536 ≈ 326 steps/epoch × 10 ep ≈ 3,260 optimizer steps
# ══════════════════════════════════════════════════════════════════════════

training:
  lm_lr:                5.0e-5
  adapter_lr:           3.0e-4
  weight_decay:         0.01
  warmup_ratio:         0.05
  grad_clip:            1.0
  n_epochs:             16
  eval_steps:           200
  early_stop_patience:  3              # 与 v1-2_ep16 一致
  early_stop_min_delta: 0.0

tasks:
  activation:
    task_training:
      batch_size:       128
      grad_accum_steps: 3              # eff batch = 128 × 4 × 3 = 1536
    adapter:
      type:       "cross_attn"
      n_tokens:   64
      dropout:    0.1
      n_contexts: 8
      n_heads:    8
      n_layers:   2
      ffn_mult:   4
    dataset:
      source:        ["wikipedia", "scientific"]
      n_samples:     312500            # 1:1 mix, 共 500k train + 125k test
      seed:          42
      test_ratio:    0.2
      recon_ratio:   0.8
      max_label_len: 128
    io:
      output_dir: "checkpoints/data_scale/oracle_act_v1-2_500k_old"
      resume:     true

    finetune:
      output_dir:           "checkpoints/data_scale/oracle_ft_v1-2_500k_old"
      lm_lr:                1.0e-4
      adapter_lr:           5.0e-5
      weight_decay:         0.01
      warmup_ratio:         0.1
      grad_clip:            1.0
      n_epochs:             10
      eval_steps:           200
      early_stop_patience:  5
      early_stop_min_delta: 0.0
      batch_size:           128
      grad_accum_steps:     3          # eff batch = 128 × 4 × 3 = 1536
      lora_target_modules:  "all-linear"
      raw_subdir:           "finetune_old"      # data/raw/finetune_old/
      qa_subdir:            "finetune_qa_old"   # data/raw/finetune_qa_old/  (注意命名是 finetune_qa_old, 不是 finetune_old_qa)
      reps_subdir:          "finetune"          # Llama-3.1-8B reps (16 sources, 历史 cache 仍在原位)
      train_subsample_ratio: 0.154     # 3.24M → ~500k QA samples (per-source stratified, seed=42)

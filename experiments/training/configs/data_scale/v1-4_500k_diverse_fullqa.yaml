model:
  name:         "Qwen/Qwen3-4B"
  lora_r:       16
  lora_alpha:   32
  lora_dropout: 0.1


# ══════════════════════════════════════════════════════════════════════════
# v1-4 adapter (cross_attn 4L Q-Former, ctx=16): Stage-1 diverse recon + Stage-2 full diverse fullqa.
# Sister of v1-4_diverse_fullqa_nostage1.yaml — same arch, same Stage-2 hparams,
# adds proper Stage-1 recon pretrain on diverse data (469k records, ~360k recon).
#
# Stage-1 budget (eff batch = 1536, ~360k recon train):
#   ~234 steps/ep × 16 ep ≈ 3750 steps  (~10-12h)
# Stage-2 budget (eff batch=1536, ~1.13M QA train):
#   ~734 steps/ep × 10 ep ≈ 7,340 steps  (~22h)
# ══════════════════════════════════════════════════════════════════════════

training:
  lm_lr:                5.0e-05
  adapter_lr:           3.0e-04
  weight_decay:         0.01
  warmup_ratio:         0.05
  grad_clip:            1.0
  n_epochs:             16
  eval_steps:           200
  early_stop_patience:  3
  early_stop_min_delta: 0.0

tasks:
  activation:
    task_training:
      batch_size:       96
      grad_accum_steps: 4              # eff batch = 1536
    adapter:
      type:        "cross_attn"
      n_tokens:    64
      dropout:     0.1
      n_contexts:  16
      n_heads:     8
      n_layers:    4
      ffn_mult:    4
    dataset:
      source: ["ag_news", "ag_news_extra", "dair_emotion", "dair_emotion_extra", "latentqa_control", "lmsys_user",
               "lmsys_user_extra", "md_gender", "ner", "scientific", "sst2", "tweeteval_emotion", "tweeteval_sentiment", "tweeteval_sentiment_extra",
               "wikipedia_concept", "wikipedia_event", "wikipedia_generic", "wikipedia_organization", "wikipedia_person", "wikipedia_place", "wikipedia_work"]
      n_samples:     null              # 用全部 469k records
      seed:          42
      test_ratio:    0.05              # → 446k train + 23k test
      recon_ratio:   0.8               # → ~356k recon train
      max_label_len: 128
      subdir:        "finetune_diversified"
      reps_subdir:   "finetune_diversified"
    io:
      output_dir: "checkpoints/data_scale/oracle_act_v1-4_500k_diverse"
      resume:     true

    finetune:
      output_dir:           "checkpoints/data_scale/oracle_ft_v1-4_500k_diverse_fullqa"
      lm_lr:                1.0e-04
      adapter_lr:           3.0e-04
      weight_decay:         0.01
      warmup_ratio:         0.1
      grad_clip:            1.0
      n_epochs:             10
      eval_steps:           200
      early_stop_patience:  5
      early_stop_min_delta: 0.0
      batch_size:           64
      grad_accum_steps:     6              # eff batch = 1536
      lora_target_modules:  "all-linear"
      raw_subdir:           "finetune_diversified"
      qa_subdir:            "finetune_qa_diversified"
      reps_subdir:          "finetune_diversified"
      train_subsample_ratio: null      # full ~1.13M QA train slots

model:
  name:         "Qwen/Qwen3-4B"
  lora_r:       16
  lora_alpha:   32
  lora_dropout: 0.1


# ══════════════════════════════════════════════════════════════════════════
# v4-1: same hyper-params as v4-0 but a Q-Former style CROSS-ATTENTION adapter
#   - adapter.type: "mlp" → "cross_attn"
#     Pipeline:
#       activation (4096) → Linear → 8 context tokens (each 2560-d)
#       64 learnable queries cross-attend to the 8 context tokens
#       output projection + LayerNorm → 64 soft tokens
#   - total params ~110M (v4-0 MLP is 860M, so ~8× smaller)
#   - expected benefit: parameter-efficient, each query adaptively attends to
#     different facets of the activation (unlike MLP's fixed one-shot mapping)
# ══════════════════════════════════════════════════════════════════════════

training:
  lm_lr:                5.0e-5
  adapter_lr:           1.0e-3
  weight_decay:         0.01
  warmup_ratio:         0.05
  grad_clip:            1.0
  n_epochs:             4
  eval_steps:           200
  early_stop_patience:  3
  early_stop_min_delta: 1.0e-4

tasks:
  activation:
    task_training:
      batch_size:       64
      grad_accum_steps: 6
    adapter:
      type:       "cross_attn"
      n_tokens:   64
      dropout:    0.1
      n_contexts: 8            # activation expanded to 8 context tokens
      n_heads:    8            # multi-head attention
    dataset:
      source:        ["wikipedia", "scientific"]
      n_samples:     null
      seed:          42
      test_ratio:    0.2
      recon_ratio:   0.8
      max_label_len: 128
    io:
      output_dir: "checkpoints/oracle_act_qwen3_4b_v4-1"
      resume:     true

    finetune:
      output_dir:          "checkpoints/oracle_ft_qwen3_4b_v4-1"
      lm_lr:               1.0e-4
      adapter_lr:          3.0e-4
      weight_decay:        0.01
      warmup_ratio:        0.1
      min_lr_ratio:        0.033
      grad_clip:           1.0
      n_epochs:            4
      eval_steps:          200
      batch_size:          32
      grad_accum_steps:    2
      lora_target_modules: ["q_proj", "v_proj"]

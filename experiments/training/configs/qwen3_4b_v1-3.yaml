model:
  name:         "Qwen/Qwen3-4B"
  lora_r:       16
  lora_alpha:   32
  lora_dropout: 0.1


# ══════════════════════════════════════════════════════════════════════════
# v1-3: scale-up of v1-2 — only deepen Q-Former, keep heads/context fixed.
#   Single-axis ablation: depth (n_layers 2 → 4). Everything else matches v1-2.
#   Earlier v1-3 / v1-3_lr3e-4 / v1-4 (lr=1e-3, n_heads=16, n_contexts=16)
#   are dropped — they changed multiple axes at once and the lr=1e-3 runs
#   overshot on the deeper architecture.
#
#   Changes from v1-2:
#     n_layers:   2 → 4     (only axis changed)
#     n_heads:    8         (unchanged)
#     n_contexts: 8         (unchanged)
#   Pipeline:
#     activation (4096) → Linear → 8 context tokens (each 2560-d)
#     64 learnable queries → 4 × (CrossAttn(8-head) + FFN 4×) → LayerNorm → 64 soft tokens
#   Param breakdown:
#     context_proj        4096 × 8·2560                   = 83.9M
#     per layer: CrossAttn 26.2M + FFN 52.4M              = 78.6M × 4 = 314.4M
#     queries + LNs                                       = 0.17M
#     TOTAL                                               ≈ 398.8M  (+66% vs v1-2 241M)
# ══════════════════════════════════════════════════════════════════════════

training:
  lm_lr:                5.0e-5
  adapter_lr:           3.0e-4    # match v1-2 (1e-3 overshot at 4 layers)
  weight_decay:         0.01
  warmup_ratio:         0.05
  grad_clip:            1.0
  n_epochs:             16        # match v1-2_ep16 for apples-to-apples depth comparison
  eval_steps:           200
  early_stop_patience:  3         # ep12 onward usually plateaus (v1-2_ep16 evidence)
  early_stop_min_delta: 1.0e-4

tasks:
  activation:
    task_training:
      batch_size:       96        # 4-layer Q-Former is heavier than v1-2's 2-layer; drop from 128 to 96
      grad_accum_steps: 4         # effective global: 96 × 4 × 4 = 1536 (match v0-4/v1-2)
    adapter:
      type:       "cross_attn"
      n_tokens:   64
      dropout:    0.1
      n_contexts: 8               # unchanged from v1-2
      n_heads:    8               # unchanged from v1-2
      n_layers:   4               # CHANGED: 2 → 4 (the single ablation axis)
      ffn_mult:   4
    dataset:
      source:        ["wikipedia", "scientific"]
      n_samples:     null
      seed:          42
      test_ratio:    0.2
      recon_ratio:   0.8
      max_label_len: 128
    io:
      output_dir: "checkpoints/oracle_act_qwen3_4b_v1-3"
      resume:     true

    finetune:
      output_dir:          "checkpoints/oracle_ft_qwen3_4b_v1-3"
      lm_lr:               1.0e-4
      adapter_lr:          3.0e-4
      weight_decay:        0.01
      warmup_ratio:        0.1
      grad_clip:           1.0
      n_epochs:            4
      eval_steps:          200
      batch_size:          32
      grad_accum_steps:    2
      lora_target_modules: ["q_proj", "v_proj"]

model:
  name:         "Qwen/Qwen3-4B"
  lora_r:       16
  lora_alpha:   32
  lora_dropout: 0.1


# ══════════════════════════════════════════════════════════════════════════
# v1-2 ep8 + bs512 (Run B): smaller effective batch, more steps, lower lr.
#   Tests hypothesis: smaller effective batch reaches a lower optimum.
#   eff batch 1536 → 512 (grad_accum 3 → 1), steps 3333 → 20000 (6×).
#   adapter_lr scaled by sqrt(1/3) ≈ 0.58: 3e-4 → 1.5e-4.
#   Changes vs v1-2_lr3e-4:
#     n_epochs:         4    → 8
#     grad_accum_steps: 3    → 1        (eff batch 1536 → 512)
#     adapter_lr:       3e-4 → 1.5e-4   (sqrt scaling)
#     output_dir renamed.
#   Caveat: three variables change simultaneously — if result moves,
#   attribution requires a follow-up.
# ══════════════════════════════════════════════════════════════════════════

training:
  lm_lr:                5.0e-5
  adapter_lr:           1.5e-4       # CHANGED: 3e-4 → 1.5e-4 (sqrt rule for 3× smaller eff batch)
  weight_decay:         0.01
  warmup_ratio:         0.05
  grad_clip:            1.0
  n_epochs:             8
  eval_steps:           500             # 20000 total steps → ~40 evals
  early_stop_patience:  3
  early_stop_min_delta: 1.0e-4

tasks:
  activation:
    task_training:
      batch_size:       128
      grad_accum_steps: 1             # CHANGED: 3 → 1, effective global: 128 × 4 × 1 = 512
    adapter:
      type:       "cross_attn"
      n_tokens:   64
      dropout:    0.1
      n_contexts: 8
      n_heads:    8
      n_layers:   2
      ffn_mult:   4
    dataset:
      source:        ["wikipedia", "scientific"]
      n_samples:     null
      seed:          42
      test_ratio:    0.2
      recon_ratio:   0.8
      max_label_len: 128
    io:
      output_dir: "checkpoints/oracle_act_qwen3_4b_v1-2/ep8_bs512"
      resume:     true

    finetune:
      output_dir:          "checkpoints/oracle_ft_qwen3_4b_v1-2_ep8_bs512"
      lm_lr:               1.0e-4
      adapter_lr:          3.0e-4
      weight_decay:        0.01
      warmup_ratio:        0.1
      grad_clip:           1.0
      n_epochs:            4
      eval_steps:          200
      batch_size:          32
      grad_accum_steps:    2
      lora_target_modules: ["q_proj", "v_proj"]
